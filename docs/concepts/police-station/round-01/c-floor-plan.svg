 y="654.00" width="154.80" height="118.80" fill="#d5c49b" stroke="#667169" stroke-width="1" /><text x="149.60" y="713.40" text-anchor="middle" dominant-baseline="middle" font-size="13">公开阅览大厅</text><path d="M227.00 722.85L227.00 703.95" stroke="#f5f0e4" stroke-width="5"/><path d="M140.15 654.00L159.05 654.00" stroke="#f5f0e4" stroke-width="5"/></g><g class="room" data-scheme="C" data-level="0" data-room="interview"><title>问询室：可见独立门，保证安静但不演成审讯谜题。</title><rect x="299.00" y="708.00" width="108.00" height="64.80" fill="#d5c49b" stroke="#667169" stroke-width="1" /><text x="353.00" y="740.40" text-anchor="middle" dominant-baseline="middle" font-size="13">问询室</text><path d="M299.00 749.85L299.00 730.95" stroke="#f5f0e4" stroke-width="5"/></g><g class="room" data-scheme="C" data-level="0" data-room="reception"><title>接待／报告：低柜台面向中央厅；公开报告桌靠近大厅。</title><rect x="299.00" y="654.00" width="108.00" height="54.00" fill="#d5c49b" stroke="#667169" stroke-width="1" /><text x="353.00" y="681.00" text-anchor="middle" dominant-baseline="middle" font-size="13">接待／报告</text><path d="M299.00 690.45L299.00 671.55" stroke="#f5f0e4" stroke-width="5"/><path d="M343.55 654.00L362.45 654.00" stroke="#f5f0e4" stroke-width="5"/></g><g class="room" data-scheme="C" data-level="0" data-room="stairs"><title>双跑楼梯：两层一致，石油蓝木扶手与窗边平台。</title><rect x="407.00" y="571.20" width="64.80" height="100.80" fill="#bfaa80" stroke="#667169" stroke-width="1" /><text x="439.40" y="621.60" text-anchor="middle" dominant-baseline="middle" font-size="13">双跑楼梯</text><path d="M407.00 645.45L407.00 626.55" stroke="#f5f0e4" stroke-width="5"/></g><g class="room" data-scheme="C" data-level="0" data-room="office"><title>办公区：木玻璃隔断后誊录桌，不藏强制证据。</title><rect x="72.20" y="571.20" width="109.80" height="46.80" fill="#aebaa9" stroke="#667169" stroke-width="1" /><text x="127.10" y="594.60" text-anchor="middle" dominant-baseline="middle" font-size="13">办公区</text><path d="M117.65 618.00L136.55 618.00" stroke="#f5f0e4" stroke-width="5"/><path