" font-size="14">建议层高：首层 3.2m，二层 3.0m</text><text x="585" y="473" font-size="14">虚线为浏览方向，不是强制任务路线</text><text x="585" y="499" font-size="14">二层仅在前方主体内；后翼为一层</text><rect x="585" y="567" width="20" height="20" fill="#d5c49b"/><text x="617" y="582" font-size="14">公共查阅／接待</text><rect x="585" y="598" width="20" height="20" fill="#aebaa9"/><text x="617" y="613" font-size="14">办公／值班</text><rect x="585" y="629" width="20" height="20" fill="#aebfc5"/><text x="617" y="644" font-size="14">档案／保管</text><rect x="585" y="660" width="20" height="20" fill="#c3aead"/><text x="617" y="675" font-size="14">旧羁押空间</text><rect x="585" y="691" width="20" height="20" fill="#c1c1b8"/><text x="617" y="706" font-size="14">盥洗／储藏</text><rect x="585" y="722" width="20" height="20" fill="#bfaa80"/><text x="617" y="737" font-size="14">楼梯</text><text x="65" y="870" font-size="13">平面是概念功能图，尚非碰撞、门窗、通道或结构验收；外观板局部透视与房位以后续共享布局为准。</text></svg>