<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 900" role="img" aria-label="内院回廊警署 两层功能平面"><rect width="1080" height="900" fill="#ece6d8"/><style>text{font-family:Microsoft YaHei,PingFang SC,Arial,sans-serif;fill:#303a37}.room{cursor:pointer}.room:hover rect{stroke:#406c65;stroke-width:3}.room text{pointer-events:none}</style><defs><marker id="arrow-D" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#477f73"/></marker></defs><text x="45" y="36" font-size="24" font-weight="bold">D　内院回廊警署　功能分区图</text><text x="45" y="59" font-size="13">北向上 · 单位米 · 色块为功能分区 · 门洞、墙厚与家具在选案后深化</text><rect x="65.00" y="90.60" width="414.00" height="702.00" fill="#e3dfd0" stroke="#7d857a" stroke-width="1" stroke-dasharray="6 5"/><text x="270" y="107" text-anchor="middle" font-size="15">北后巷／后院门</text><text x="266" y="805" text-anchor="middle" font-size="15">南侧车站路／公共前门</text><text x="45" y="440" transform="rotate(-90 45 440)" text-anchor="middle" font-size="14">宅地深 39m</text><text x="270" y="831" text-anchor="middle" font-size="14">宅地宽 23m</text><text x="65" y="87" font-size="18" font-weight="bold">一层与院落</text><text x="266" y="250" text-anchor="middle" font-size="14">后勤院／通往北门</text><rect x="65.00" y="564.00" width="414.00" height="216.00" fill="#f5f0e4" stroke="#46534c" stroke-width="3" /><rect x="65.00" y="348.00" width="99.00" height="216.00" fill="#f5f0e4" stroke="#46534c" stroke-width="3" /><rect x="380.00" y="348.00" width="99.00" height="216.00" fill="#f5f0e4" stroke="#46534c" stroke-width="3" /><rect x="245.00" y="654.00" width="54.00" height="118.80" fill="#e2dfcf" stroke="none" stroke-width="0" /><rect x="72.20" y="618.00" width="334.80" height="36.00" fill="#e2dfcf" stroke="none" stroke-width="0" /><rect x="182.00" y="564.00" width="30.60" height="54.00" fill="#e2dfcf" stroke="none" stroke-width="0" /><rect x="164.00" y="348.00" width="27.00" height="216.00" fill="#e2dfcf" stroke="none" stroke-width="0" /><rect x="353.00" y="348.00" width="27.00" height="216.00" fill="#e2dfcf" stroke="none" stroke-width="0" /><rect x="191.00" y="348.00" width="162.00" height="216.00" fill="#e2dfcf" stroke="none" stroke-width="0" /><g class="room" data-scheme="D" data-level="0" data-room="read"><title>案卷阅览：前桌阅读、北面朝院窗，资料随时可读。</title><rect x="72.20" y="654.00" width="172.80" height="118.80" fill="#d5c49b" stroke="#667169" stroke-width="1" /><text x="158.60" y="713.40" text-anchor="middle" dominant-baseline="middle" font-size="13">案卷阅览</text><path d="M245.00 722.85L245.00 703.95" stroke="#f5f0e4" stroke-width="5"/><path d="M149.15 654.00L168.05 654.00" stroke="#f5f0e4" stroke-width="5"/></g><g class="room" data-scheme="D" data-level="0" data-room="interview"><title>问询室：不与后翼羁押空间共门。</title><rect x="299.00" y="654.00" width="108.00" height="118.80" fill="#d5c49b" stroke="#667169" stroke-width="1" /><text x="353.00" y="713.40" text-anchor="middle" dominant-baseline="middle" font-size="13">问询室</text><path d="M299.00 722.85L299.00 703.95" stroke="#f5f0e4" stroke-width="5"/><path d="M343.55 654.00L362.45 654.00" stroke="#f5f0e4" stroke-width="5"/></g><g class="room" data-scheme="D" data-level="0" data-room="stairs"><title>双跑楼梯：只上前楼二层；后翼屋面不能当二层走。</title><rect x="407.00" y="571.20" width="64.80" height="100.80" fill="#bfaa80" stroke="#667169" stroke-width="1" /><text x="439.40" y="621.60" text-anchor="middle" dominant-baseline="middle" font-size="13">双跑楼梯</text><path d="M407.00 645.45L407.00 626.55" stroke="#f5f0e4" stroke-width="5"/></g><g class="room" data-scheme="D" data-level="0" data-room="catalog"><title>档案誊录：面院小桌，框景通向回廊。</title><rect x="72.20" y="571.20" width="109.80" height="46.80" fill="#aebaa9" stroke="#667169" stroke-width="1" /><text x="127.10" y="594.60" text-anchor="middle" dominant-baseline="middle" font-size="13">档案誊录</text><path d="M117.65 618.00L136.55 618.00" stroke="#f5f0e4" stroke-width="5"/><path d="M182.00 604.05L182.00 585.15" stroke="#f5f0e4" stroke-width="5"/></g><g class="room" data-scheme="