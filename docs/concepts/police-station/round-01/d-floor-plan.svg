档案／保管</text><rect x="585" y="660" width="20" height="20" fill="#c3aead"/><text x="617" y="675" font-size="14">旧羁押空间</text><rect x="585" y="691" width="20" height="20" fill="#c1c1b8"/><text x="617" y="706" font-size="14">盥洗／储藏</text><rect x="585" y="722" width="20" height="20" fill="#bfaa80"/><text x="617" y="737" font-size="14">楼梯</text><text x="65" y="870" font-size="13">平面是概念功能图，尚非碰撞、门窗、通道或结构验收；外观板局部透视与房位以后续共享布局为准。</text></svg>